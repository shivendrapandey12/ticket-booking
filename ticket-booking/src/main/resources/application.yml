server:
  port: 8080

spring:
  application:
    name: ticket-booking
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ticketdb?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  jwt:
    # Use a long random value (min 32 chars) via env var in production
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234}
    access-token-minutes: 15
    refresh-token-days: 7
  booking:
    seat-lock-minutes: 5
  rate-limit:
    requests-per-minute: 30
  kafka:
    booking-topic: booking-events
  admin:
    email: ${ADMIN_EMAIL:admin@ticket.com}
    password: ${ADMIN_PASSWORD:Admin@12345}

management:
  endpoints:
    web:
      exposure:
        include: health,info
